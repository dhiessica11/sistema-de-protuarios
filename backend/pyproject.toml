[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "prontuario-ed"
version = "0.2.3"
description = "Prontuario Eletronico Espaco Desenvolver"
requires-python = ">=3.12,<3.14"
# Faixas suportadas; versoes exatas e hashes em requirements-dev.lock.
dependencies = [
    "django>=5.2.18,<5.3",
    "djangorestframework>=3.18.3,<3.19",
    "psycopg[binary]==3.2.*",
    "celery[redis]==5.4.*",
    "redis==5.0.*",
    "pynacl>=1.6.2,<1.7",
    "pyotp==2.9.*",
    "python-magic==0.4.*",
    "django-environ==0.11.*",
    "django-cors-headers==4.4.*",
    "django-ratelimit==4.1.*",
    "whitenoise==6.7.*",
    "gunicorn==23.0.*",
    "argon2-cffi==23.1.*",
    "python-stdnum==1.20.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-django>=4.12,<5",
    "pytest-cov==5.0.*",
    "ruff==0.6.*",
    "bandit==1.7.*",
    "pip-audit==2.7.*",
    "factory-boy==3.3.*",
    "faker==28.0.*",
    "ipython==8.26.*",
    "pip>=26.2,<27",
    "pip-tools>=7.5,<8",
    "setuptools>=84.1,<85",
    "wheel>=0.46,<1",
]

[tool.setuptools]
packages = ["apps", "apps.core", "apps.core.tests", "apps.clinica", "apps.clinica.migrations", "apps.clinica.tests", "config", "config.settings"]
py-modules = ["conftest", "manage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]
"**/tests/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]
