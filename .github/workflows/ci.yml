name: CI

on:
  push:
    branches: [main, develop, desenvolvimento]
  pull_request:
    branches: [main, develop, desenvolvimento]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prontuario
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: prontuario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install deps
        working-directory: ./backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
          pip check

      - name: Ruff lint
        working-directory: ./backend
        run: ruff check .

      - name: Ruff format check
        working-directory: ./backend
        run: ruff format --check .

      - name: Bandit security
        working-directory: ./backend
        run: bandit -r apps config -ll

      - name: pip-audit
        working-directory: ./backend
        run: pip-audit --strict --require-hashes --disable-pip -r requirements-dev.lock

      - name: Check de migrations faltando
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://prontuario:test_password@localhost:5432/prontuario_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py makemigrations --check --dry-run
          # Falha se houver mudanca de model nao migrada

      - name: Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://prontuario:test_password@localhost:5432/prontuario_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=70
